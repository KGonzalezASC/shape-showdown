name: Deploy Shape Showdown

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: shape-showdown-prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set game server URL
        run: echo '{"gameServerUrl":"${{ secrets.GAME_SERVER_URL }}"}' > public/game-config.json

      - name: Build client
        run: bun run build:client

      - name: Build replay viewer
        run: bun run build:replay

      - name: Compile server binary (standalone, Linux x64)
        run: bun run build:server:bin

      - name: Deploy client static files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          source: "dist/client/*"
          target: "${{ secrets.CLIENT_DEPLOY_PATH }}"
          strip_components: 2
          rm: true

      - name: Deploy replay viewer static files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          source: "dist/replay-viewer/*"
          target: "${{ secrets.REPLAY_DEPLOY_PATH }}"
          strip_components: 2
          rm: true

      - name: Deploy server binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          source: "dist-server/shape-showdown-server.x86_64"
          target: "${{ secrets.SERVER_DEPLOY_PATH }}/build"
          strip_components: 1

      - name: Restart game server service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          script: |
            chmod +x ${{ secrets.SERVER_DEPLOY_PATH }}/build/shape-showdown-server.x86_64
            sudo systemctl restart shape-showdown-server
            sleep 2
            sudo systemctl is-active shape-showdown-server
